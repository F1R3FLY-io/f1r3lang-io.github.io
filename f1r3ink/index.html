<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  @media (max-width: 768px) {
    html, body { overflow-y: auto; overflow-x: hidden; height: auto; min-height: 100vh; }

    .game-sidebar-right { display: flex !important; flex-direction: column !important; border-top: 1px solid rgba(0,123,196,0.4) !important; padding: 16px !important; }
    .game-header { position: sticky; top: 0; z-index: 50; background: #000 !important; min-height: auto !important; padding: 8px 12px !important; flex-wrap: wrap !important; gap: 8px !important; }

  @media (max-width: 480px) {
    .game-header span[style*="fontSize:16"] { font-size: 13px !important; letter-spacing: 1px !important; }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

// ══════════════════════════════════════════════════════════════
// F1R3INK — Branded Prototype (Static Mockup)
// F1R3FLY Brand Book March 27, 2026 — Hannah Adams
// ══════════════════════════════════════════════════════════════

const BRAND = { yellow:"#F3D630", sage:"#8BB999", sky:"#3FA9F5", surface:"#000000", card:"#0c0c18", border:"#007bc466", stroke:"linear-gradient(90deg, #F3D630, #8BB999)", text:"#ffffff", textMuted:"#ffffff", textDim:"#ffffff", textSecondary:"#A0A0A0" };
const FONTS = `@import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Source+Sans+3:wght@200;300;400;600;700&display=swap');`;
const FH = "'Josefin Sans', sans-serif";
const FB = "'Source Sans 3', sans-serif";
const INK_ACCENT = "#DC2547";
const INK_COLORS = [
  {hex:"#7B0429",name:"scarlet"},{hex:"#FF6B2B",name:"ember"},{hex:"#F3D630",name:"yellow"},
  {hex:"#0C8E23",name:"green"},{hex:"#009188",name:"teal"},{hex:"#3FA9F5",name:"sky"},
  {hex:"#7A7DE8",name:"light-indigo"},{hex:"#5C0269",name:"purple"},{hex:"#7A9D0E",name:"lime"},
  {hex:"#FFFFFF",name:"white"},{hex:"#8BB999",name:"sage"},{hex:"#3F3F3F",name:"gray"}
];

const PORTRAITS = {
  hannah: "images/hannah-adams.jpg",
  claude: "images/greg-meredith.jpg",
  gemini: "images/mike-stay.jpg",
  grok: "images/lilia-rusu.jpg",
  llama: "images/jeff-turner.jpg",
  scarlet: "images/stephen-alexander.jpg"
};

// Demo players — static data, no storage
const DEMO_PLAYERS = [
  { id:"claude", name:"Greg", tags:["founder","rho-calculus"], isAI:false, portrait:PORTRAITS.claude,
    inks:[{color:"#7B0429",from:"Lilia"},{color:"#0C8E23",from:"Steve"},{color:"#7A7DE8",from:"Hannah"},{color:"#F3D630",from:"Jeff"},{color:"#3FA9F5",from:"Mike"}] },
  { id:"gemini", name:"Mike", tags:["research"], isAI:false, portrait:PORTRAITS.gemini,
    inks:[{color:"#F3D630",from:"Greg"},{color:"#3FA9F5",from:"Hannah"},{color:"#5C0269",from:"Lilia"}] },
  { id:"grok", name:"Lilia", tags:["operations"], isAI:false, portrait:PORTRAITS.grok,
    inks:[{color:"#5C0269",from:"Jeff"},{color:"#FF6B2B",from:"Hannah"},{color:"#009188",from:"Greg"},{color:"#7B0429",from:"Steve"}] },
  { id:"llama", name:"Jeff", tags:["product"], isAI:false, portrait:PORTRAITS.llama,
    inks:[{color:"#7B0429",from:"Hannah"},{color:"#0C8E23",from:"Greg"},{color:"#7A7DE8",from:"Mike"}] },
  { id:"scarlet", name:"Steve", tags:["CEO","London"], isAI:false, portrait:PORTRAITS.scarlet,
    inks:[{color:"#0C8E23",from:"Hannah"},{color:"#F3D630",from:"Greg"},{color:"#7A7DE8",from:"Lilia"},{color:"#FF6B2B",from:"Mike"},{color:"#009188",from:"Jeff"},{color:"#5C0269",from:"Greg"}] }
];

const MY_INKS = [{color:"#5C0269",from:"Steve"},{color:"#F3D630",from:"Greg"},{color:"#009188",from:"Lilia"},{color:"#7B0429",from:"Mike"},{color:"#0C8E23",from:"Jeff"}];

function Avatar({src, size=48}) {
  return <img src={src} alt="" style={{width:size, height:size, borderRadius:"50%", objectFit:"cover", border:`2px solid ${BRAND.border}`, flexShrink:0}} />;
}

function AIIcon({size=14, color=BRAND.sky}) {
  return (<svg width={size} height={size} viewBox="0 0 16 16" fill="none">
    <rect x="3" y="3" width="10" height="10" rx="2" stroke={color} strokeWidth="1.3" fill="none"/>
    <circle cx="6.5" cy="7.5" r="1" fill={color}/><circle cx="9.5" cy="7.5" r="1" fill={color}/>
    <path d="M6 10.5c0 0 .8 1 2 1s2-1 2-1" stroke={color} strokeWidth="1" fill="none" strokeLinecap="round"/>
    <line x1="8" y1="1" x2="8" y2="3" stroke={color} strokeWidth="1.3" strokeLinecap="round"/>
  </svg>);
}

function HumanIcon({size=14, color="#fff"}) {
  return (<svg width={size} height={size} viewBox="0 0 16 16" fill="none">
    <circle cx="8" cy="5" r="3" stroke={color} strokeWidth="1.5" fill="none"/>
    <path d="M2.5 15c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5" stroke={color} strokeWidth="1.5" fill="none" strokeLinecap="round"/>
  </svg>);
}

// HOW THIS WORKS button — neutral dark, NOT gradient (avoids competing with JOIN)
function HowBtn({onClick}) {
  return <button onClick={onClick} style={{background:"#000", border:`1px solid ${BRAND.border}`, color:"#fff", borderRadius:20, padding:"12px 24px 8px", fontSize:16, cursor:"pointer", fontFamily:FH, letterSpacing:2, fontWeight:300, display:"inline-flex", alignItems:"center", justifyContent:"center", lineHeight:1, minHeight:38, whiteSpace:"nowrap"}}>HOW THIS WORKS</button>;
}

function TourIcon({type, color="#fff", size=48}) {
  const icons = {
    droplet: <svg width={size} height={size} viewBox="0 0 48 48" fill="none"><path d="M24 6c0 0-14 16-14 26a14 14 0 0028 0c0-10-14-26-14-26z" stroke={color} strokeWidth="1.5" strokeLinejoin="round"/><circle className="tdrop-inner" cx="24" cy="30" r="4" fill={color} opacity=".3"/></svg>,
    globe: <svg width={size} height={size} viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="18" stroke={color} strokeWidth="1.5"/><ellipse className="tglobe-spin" cx="24" cy="24" rx="9" ry="18" stroke={color} strokeWidth="1.5"/><line x1="6" y1="24" x2="42" y2="24" stroke={color} strokeWidth="1.5"/><path d="M8 14h32M8 34h32" stroke={color} strokeWidth="1" opacity=".5"/></svg>,
    flag: <svg width={size} height={size} viewBox="0 0 48 48" fill="none"><line x1="12" y1="6" x2="12" y2="42" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><path className="tflag-wave" d="M12 8h24l-6 8 6 8H12" stroke={color} strokeWidth="1.5" fill={color} fillOpacity=".15"/></svg>,
    chain: <svg width={size} height={size} viewBox="0 0 48 48" fill="none"><rect className="tchain-l" x="8" y="14" width="14" height="20" rx="4" stroke={color} strokeWidth="1.5"/><rect className="tchain-r" x="26" y="14" width="14" height="20" rx="4" stroke={color} strokeWidth="1.5"/><line x1="22" y1="21" x2="26" y2="21" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><line x1="22" y1="27" x2="26" y2="27" stroke={color} strokeWidth="1.5" strokeLinecap="round"/></svg>,
  };
  return icons[type] || null;
}

function TourOverlay({onClose}) {
  const slides = [
    { icon:"droplet", title:"INK IS FEELING\nMADE VISIBLE", body:"Choose a color. Send it to someone. That\u2019s an ink \u2014 a non-verbal signal that says something words can\u2019t. Not a like. Not a vote. A feeling." },
    { icon:"globe", title:"YOUR UNIQUE F1R3SIGN\nTRAVELS WITH YOU", body:"Your F1R3Sign isn\u2019t locked to this game. It moves with you across every service built on F1R3FLY. One sign, one reputation, everywhere." },
    { icon:"flag", title:"YOUR FLAG\nTELLS YOUR STORY", body:"Every ink you receive becomes a stripe on your flag. Over time, your flag becomes a portrait painted by your community \u2014 not by you." },
    { icon:"chain", title:"BUILT ON\nF1R3FLY", body:"F1R3INK runs on F1R3FLY\u2019s shared computing layer. Every ink is a real transaction on a real shard. No central server. No single point of failure." },
  ];
  const [si, setSi] = useState(0);
  const s = slides[si];
  const isLast = si === slides.length - 1;
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.95)",backdropFilter:"blur(12px)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:FH}} onClick={onClose}>
      <style>{`@keyframes tourIn{from{opacity:0;transform:scale(0.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes dropPulse{0%,100%{opacity:.3;r:4}50%{opacity:.7;r:5}}
.tdrop-inner{animation:dropPulse 2.5s ease-in-out infinite}
@keyframes globeSway{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.4)}}
.tglobe-spin{transform-origin:center;animation:globeSway 4s ease-in-out infinite}
@keyframes flagWave{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.tflag-wave{animation:flagWave 2.5s ease-in-out infinite}
@keyframes chainSlide{0%,100%{transform:translateX(0)}50%{transform:translateX(-2px)}}
@keyframes chainSlideR{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
.tchain-l{animation:chainSlide 3s ease-in-out infinite}.tchain-r{animation:chainSlideR 3s ease-in-out infinite}`}</style>
      <div onClick={e=>e.stopPropagation()} style={{animation:"tourIn .35s ease-out",maxWidth:460,width:"90%",padding:"48px 36px 40px",border:`1px solid #007bc466`,borderRadius:14,background:"#000",textAlign:"center"}}>
        <div style={{marginBottom:20}}><TourIcon type={s.icon} size={48}/></div>
        <div style={{fontSize:20,fontWeight:700,letterSpacing:4,color:BRAND.yellow,lineHeight:1.7,whiteSpace:"pre-line",margin:"0 0 16px",fontFamily:FH}}>{s.title}</div>
        <div style={{width:80,height:1,background:"linear-gradient(90deg, #F3D630, #8BB999)",margin:"0 auto 20px"}}/>
        <div style={{fontSize:17,fontWeight:200,color:"#fff",lineHeight:1.6,fontFamily:FB,letterSpacing:0.2,marginBottom:36}}>{s.body}</div>
        <div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:28}}>
          {slides.map((_,i)=><div key={i} onClick={()=>setSi(i)} style={{width:10,height:10,borderRadius:"50%",background:i===si?BRAND.yellow:"rgba(255,255,255,0.2)",cursor:"pointer",transition:"background .2s"}} />)}
        </div>
        <div style={{display:"flex",justifyContent:"center",gap:16}}>
          {si > 0 && <button onClick={()=>setSi(si-1)} style={{background:"#000",border:`1px solid ${BRAND.border}`,color:"#fff",borderRadius:20,padding:"12px 24px 8px",fontSize:16,fontFamily:FH,letterSpacing:2,cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:1,minHeight:38}}>BACK</button>}
          <button onClick={()=>isLast?onClose():setSi(si+1)} style={{background:"linear-gradient(135deg, #5c0269, #7b0429)",border:"none",color:"#fff",borderRadius:20,padding:"12px 28px 8px",fontSize:16,fontFamily:FH,letterSpacing:2,fontWeight:600,cursor:"pointer",boxShadow:"0 0 16px rgba(123,4,41,0.4)",display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:1,minHeight:38}}>{isLast?"\u2019S GO":"NEXT"}</button>
        </div>
      </div>
    </div>
  );
}

// Built on F1R3FLY.IO badge
function BuiltOnBadge() {
  return (
    <div style={{padding:"12px 0",display:"flex",justifyContent:"center",zIndex:100,background:"#000",cursor:"pointer"}} onClick={()=>window.open&&window.open("https://f1r3fly.io","_blank")}>
      <img src="built-on-f1r3fly.io-box.svg" alt="Built on F1R3FLY.IO" style={{height:48,display:"block"}}/>
    </div>
  );
}

// ── F1R3INK lockup ────────────────────────────────────────────
// External SVG: images/f1r3ink-logo-v2.svg (viewBox 2323.894 × 1516.829, ratio ~1.53:1)
function InkLogo({height=72}) {
  return <img src="images/f1r3ink-logo-v2.svg" alt="F1R3Ink" style={{height,display:"block"}}/>;
}

// ── Main App ──────────────────────────────────────────────────
function F1R3Ink() {
  const [phase, setPhase] = useState("join");
  const [myName, setMyName] = useState("");
  const [myTags, setMyTags] = useState("");
  const [showTour, setShowTour] = useState(false);
  const [selectedTarget, setSelectedTarget] = useState(null);
  const [selectedColor, setSelectedColor] = useState(null);

  // ── JOIN SCREEN ──────────────────────────────────────────
  if (phase === "join") return (
    <div style={{height:"100vh",overflow:"hidden",background:"#000",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",fontFamily:FH,position:"relative"}}>
      <style>{FONTS}{`@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}} input:focus{border-color:#007bc466 !important;outline:none} input::placeholder, textarea::placeholder { color: ${BRAND.textSecondary}; opacity: 1; }`}</style>
      <div style={{animation:"fadeIn .6s ease-out",textAlign:"center",marginTop:-105,position:"relative",zIndex:1}}>
        <F1R3GamesLogo width={196}/>
        <div style={{fontSize:16,color:"#fff",letterSpacing:4,fontFamily:FH,fontWeight:300,marginTop:24}}>PRESENTS</div>
        <div style={{height:40}}/>
        <div style={{border:`1px solid #007bc466`,borderRadius:14,padding:"40px 48px",display:"inline-block",background:"#000"}}>
          <h1 style={{margin:"0 0 20px",display:"flex",alignItems:"center",justifyContent:"center"}}><InkLogo height={74}/></h1>
          <div style={{fontSize:16,color:"#fff",letterSpacing:2,fontWeight:300,fontFamily:FH,lineHeight:1.6}}>YOUR TRUE COLORS<br/>COME SHINING THROUGH</div>
        </div>
        <div style={{height:50}}/>
        <div style={{display:"flex",flexDirection:"column",gap:10,alignItems:"center"}}>
          <div style={{fontSize:16,color:BRAND.yellow,letterSpacing:4,fontWeight:700,fontFamily:FH}}>CHOOSE YOUR F1R3SIGN</div>
          <input value={myName} onChange={e=>setMyName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&myName.trim()&&setPhase("play")} placeholder="someone colorful" style={{background:"#000",border:`1px solid #007bc466`,borderRadius:6,color:"#fff",padding:"10px 16px",fontSize:16,fontWeight:300,width:"100%",maxWidth:460,fontFamily:FH,textAlign:"center",outline:"none",marginTop:20}}/>
          <input value={myTags} onChange={e=>setMyTags(e.target.value)} placeholder="tags: mood, vibe, role..." style={{background:"#000",border:`1px solid #007bc466`,borderRadius:6,color:"#fff",padding:"10px 16px",fontSize:16,width:"100%",maxWidth:460,fontFamily:FH,textAlign:"center",outline:"none"}}/>
          <button onClick={()=>myName.trim()&&setPhase("play")} style={{background:"linear-gradient(135deg, #5c0269, #7b0429)",color:"#fff",border:"none",borderRadius:20,padding:"12px 32px 8px",fontSize:16,fontFamily:FH,fontWeight:600,cursor:"pointer",letterSpacing:3,boxShadow:"0 0 20px rgba(123,4,41,0.4)",marginTop:20,display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:1,minHeight:38,whiteSpace:"nowrap"}}>JOIN</button>
          <div style={{fontSize:16,color:"#fff",letterSpacing:3,fontWeight:300,fontFamily:FH,lineHeight:1.6,marginTop:20}}>YOUR UNIQUE F1R3SIGN<br/>TRAVELS WITH YOU</div>
          <div style={{marginTop:12}}><HowBtn onClick={()=>setShowTour(true)}/></div>
        </div>
        {DEMO_PLAYERS.length > 0 && <div style={{marginTop:16,color:BRAND.textDim,fontSize:14}}>{DEMO_PLAYERS.length} playing</div>}
      </div>
      <BuiltOnBadge/>
      {showTour && <TourOverlay onClose={()=>setShowTour(false)}/>}
    </div>
  );

  // ── GAME VIEW ──────────────────────────────────────────────
  const displayName = myName.trim() || "Hannah";
  const totalInks = DEMO_PLAYERS.reduce((a,p) => a + p.inks.length, 0) + MY_INKS.length;

  return (
    <div style={{minHeight:"100vh",background:"#000",color:"#fff",fontFamily:FH,display:"flex",flexDirection:"column",overflow:"hidden",position:"relative"}}>
      <style>{FONTS}{`::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px} *{box-sizing:border-box} input::placeholder, textarea::placeholder { color: ${BRAND.textSecondary}; opacity: 1; }`}</style>

      {/* Header */}
      <div className="game-header" style={{padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"#000",minHeight:70}}>
        <div style={{display:"flex",alignItems:"baseline",gap:12}}>
          <InkLogo height={32}/>
          <span style={{fontSize:16,fontWeight:200,color:"#fff",letterSpacing:2,fontFamily:FB}}>{DEMO_PLAYERS.length + 1} players | {totalInks} inks | shard live</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <HowBtn onClick={()=>setShowTour(true)}/>
          <button onClick={()=>setPhase("join")} style={{background:"#000",border:`1px solid ${BRAND.border}`,color:"#fff",borderRadius:20,padding:"10px 18px 8px",fontSize:16,cursor:"pointer",fontFamily:FH,letterSpacing:1,fontWeight:300,display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:1,minHeight:38,whiteSpace:"nowrap"}}>LEAVE</button>
        </div>
      </div>

      {/* Gradient stroke */}
      <div style={{width:"100%",height:"0.5px",background:BRAND.stroke,opacity:0.8}}/>

      {/* 3-column layout */}
      <div className="game-layout" style={{flex:1,display:"flex",overflow:"hidden"}}>

        {/* Left Sidebar — My Flag */}
        <div className="game-sidebar game-sidebar-left" style={{width:300,minWidth:300,flexShrink:0,borderRight:`1px solid ${BRAND.border}`,padding:"20px 16px",display:"flex",flexDirection:"column",gap:20,overflowY:"auto",background:"#000"}}>

          {/* MY FLAG section */}
          <div style={{paddingBottom:20,borderBottom:`1px solid ${BRAND.border}`,display:"flex",flexDirection:"column",gap:12,alignItems:"center"}}>
            <div style={{fontSize:16,color:"#fff",letterSpacing:2,fontFamily:FH,textTransform:"uppercase",alignSelf:"flex-start"}}>MY FLAG</div>
            <Avatar src={PORTRAITS.hannah} size={80}/>
            <div style={{fontSize:16,color:BRAND.yellow,fontWeight:600,fontFamily:FB,letterSpacing:0.2}}>{displayName}</div>
            <div style={{width:"100%"}}>
              <div style={{fontSize:16,color:"#fff",marginBottom:8,letterSpacing:2,fontFamily:FH,textTransform:"uppercase"}}>TAGS</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                {(myTags.trim() ? myTags.split(",").map(t=>t.trim()).filter(Boolean) : ["Pooh"]).map((t,i) =>
                  <span key={i} style={{background:BRAND.card,border:`1px solid ${BRAND.border}`,borderRadius:20,padding:"2px 12px",fontSize:16,color:BRAND.sage,fontFamily:FB}}>{t}</span>
                )}
              </div>
            </div>
          </div>

          {/* F1R3 SIGNALS section */}
          <div style={{paddingBottom:20,borderBottom:`1px solid ${BRAND.border}`,display:"flex",flexDirection:"column",gap:12}}>
            <div style={{fontSize:16,color:"#fff",letterSpacing:2,fontFamily:FH,textTransform:"uppercase"}}>F1R3 SIGNALS</div>
            <div style={{fontSize:16,fontWeight:200,color:BRAND.sky,fontFamily:FB,letterSpacing:0.2,lineHeight:1.4}}>Not a &quot;like&quot; button — a feeling</div>
            {selectedTarget
              ? <div style={{fontSize:16,fontWeight:200,color:"#fff",fontFamily:FB,letterSpacing:0.2}}>How do you feel about <span style={{color:BRAND.yellow,fontWeight:600}}>{DEMO_PLAYERS.find(p=>p.id===selectedTarget)?.name}</span>?</div>
              : <div style={{fontSize:16,fontWeight:200,color:BRAND.textSecondary,fontFamily:FB,letterSpacing:0.2}}>select someone to ink</div>}
            <div style={{display:"grid",gridTemplateColumns:"repeat(6, 1fr)",gap:"10px 6px",justifyItems:"center"}}>
              {INK_COLORS.map(c => (
                <div key={c.hex} title={c.name} onClick={()=>setSelectedColor(c.hex)} style={{width:24,height:24,borderRadius:"50%",background:c.hex,cursor:"pointer",border:selectedColor===c.hex?"2px solid #fff":`1px solid ${BRAND.border}`,transition:"transform 0.15s",transform:selectedColor===c.hex?"scale(1.3)":"scale(1)"}}/>
              ))}
            </div>
            {selectedColor && selectedTarget && (
              <div style={{textAlign:"center",marginTop:4}}>
                <button style={{background:selectedColor,color:(selectedColor==="#F3D630"||selectedColor==="#FFFFFF"||selectedColor==="#7A9D0E")?"#111":"#fff",border:"none",borderRadius:20,padding:"12px 32px 8px",fontSize:16,fontFamily:FH,fontWeight:600,cursor:"pointer",letterSpacing:3,display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:1,minHeight:38,whiteSpace:"nowrap",boxShadow:`0 0 20px ${selectedColor}44`}}>INK</button>
              </div>
            )}
            <div style={{fontSize:16,fontWeight:200,color:BRAND.textSecondary,fontFamily:FB,letterSpacing:0.2}}>How does this F1R3INK make you feel?</div>
          </div>
        </div>

        {/* Center — Community */}
        <div style={{flex:1,overflowY:"auto",padding:"24px 32px",background:"#000"}}>
          <div style={{fontSize:16,color:"#fff",letterSpacing:2,marginBottom:20,fontFamily:FH,textTransform:"uppercase"}}>COMMUNITY WHEEL</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(200px, 1fr))",gap:20}}>
            {/* My card */}
            <div style={{padding:20,borderRadius:8,border:`1px solid ${BRAND.border}`,background:"#000",textAlign:"center"}}>
              <Avatar src={PORTRAITS.hannah} size={72}/>
              <div style={{fontSize:16,color:BRAND.yellow,fontWeight:600,marginTop:8,fontFamily:FB,letterSpacing:0.2}}>{displayName}</div>
              <div style={{display:"flex",gap:3,justifyContent:"center",marginTop:10,flexWrap:"wrap"}}>
                {MY_INKS.map((ink,i) => <div key={i} style={{width:16,height:16,borderRadius:"50%",background:ink.color}} title={`from ${ink.from}`}/>)}
              </div>
              <div style={{fontSize:16,fontWeight:200,color:BRAND.textSecondary,marginTop:6,fontFamily:FB,letterSpacing:0.2}}>{MY_INKS.length} inks</div>
            </div>
            {/* Other players */}
            {DEMO_PLAYERS.map(p => (
              <div key={p.id} onClick={()=>setSelectedTarget(selectedTarget===p.id ? null : p.id)} style={{padding:20,borderRadius:8,border:selectedTarget===p.id?`1px solid ${BRAND.sky}`:`1px solid ${BRAND.border}`,background:selectedTarget===p.id?"rgba(63,169,245,0.06)":"#000",textAlign:"center",cursor:"pointer",transition:"all 0.2s"}}>
                <Avatar src={p.portrait} size={72}/>
                <div style={{fontSize:16,color:selectedTarget===p.id?BRAND.sky:"#fff",fontWeight:600,marginTop:8,fontFamily:FB,letterSpacing:0.2}}>{p.name}</div>
                <div style={{display:"flex",gap:3,justifyContent:"center",marginTop:10,flexWrap:"wrap"}}>
                  {p.inks.map((ink,i) => <div key={i} style={{width:16,height:16,borderRadius:"50%",background:ink.color}} title={`from ${ink.from}`}/>)}
                </div>
                <div style={{fontSize:16,fontWeight:200,color:BRAND.textSecondary,marginTop:6,fontFamily:FB,letterSpacing:0.2}}>{p.inks.length} ink{p.inks.length!==1?"s":""}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Right Sidebar — Inked By */}
        <div className="game-sidebar game-sidebar-right" style={{width:300,minWidth:300,flexShrink:0,borderLeft:`1px solid ${BRAND.border}`,padding:"20px 16px",display:"flex",flexDirection:"column",gap:20,overflowY:"auto",background:"#000"}}>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div style={{fontSize:16,color:"#fff",letterSpacing:2,fontFamily:FH,textTransform:"uppercase"}}>INKED BY</div>
            {MY_INKS.length > 0 ? (
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {MY_INKS.map((s,i) => (
                  <div key={i} style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{width:12,height:12,borderRadius:"50%",background:s.color,flexShrink:0,border:`1px solid ${BRAND.border}`}}/>
                    <span style={{fontSize:16,fontWeight:200,color:"#fff",fontFamily:FB,letterSpacing:0.2}}>{s.from}</span>
                  </div>
                ))}
              </div>
            ) : (
              <div style={{color:BRAND.textSecondary,fontSize:16,fontWeight:200,textAlign:"center",lineHeight:1.6,fontFamily:FB,letterSpacing:0.2}}>no ink yet<br/><span>others will color your flag</span></div>
            )}
            <div style={{fontSize:16,fontWeight:200,color:BRAND.textSecondary,fontFamily:FB,letterSpacing:0.2,marginTop:4}}>powered by F1R3INK</div>
          </div>
        </div>
      </div>
      <BuiltOnBadge/>
      {showTour && <TourOverlay onClose={()=>setShowTour(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<F1R3Ink/>);
</script>
</body>
</html>
