<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useReducer } = React;

const BRAND = {
  yellow: "#F3D630", sage: "#8BB999", sky: "#3FA9F5",
  surface: "#000000", card: "#0c0c18",
  border: "#007bc466",
  stroke: "linear-gradient(90deg, #F3D630, #8BB999)",
  text: "#ffffff", textMuted: "#ffffff", textDim: "#ffffff",
  textSecondary: "#A0A0A0"
};
const FONTS = `@import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap');`;
const FH = "'Josefin Sans', sans-serif";
const FB = "'Source Sans 3', sans-serif";
const CHAT_ACCENT = "#8BB999"; // brand sage

function SideChatLogo({height=240}) {
  return <img src="images/f1r3sidechat-logo.svg" alt="F1R3SIDECHAT" style={{height,width:"auto",display:"block"}} />;
}

const STORY = {
  title: "The Cartographer of Lost Rivers",
  genre: "Mystery / Fantasy",
  author: { id: "p2", name: "Aria", color: BRAND.sky },
  synopsis: "A blind cartographer hears rivers flowing beneath the streets. When buildings start collapsing into hidden waterways, she must map the invisible before the city drowns.",
  readers: 234,
  chapters: [
    { id: "ch1", num: 1, title: "The Sound Beneath Concrete", authorId: "p2", status: "published",
      text: "The first time Maren heard the river, she thought it was rain.\n\nShe was standing at the corner of Ash Street and Viaduct, her white cane tapping the familiar rhythm against the curb. The city hummed its usual frequencies \u2014 diesel idling, a busker\u2019s violin two blocks east, the staccato of heels on the pedestrian bridge above. But underneath all of it, threading through the concrete like a whispered secret, was the sound of moving water.\n\nNot storm drains. Not burst pipes. This was older. Deeper. A current that remembered being a river.\n\n\u201CYou hear that?\u201D she asked the dog. Sable\u2019s ears perked, but the guide dog gave no indication of alarm. Water was water. But Maren\u2019s hands were trembling on the harness.\n\nShe had been blind since she was nine \u2014 long enough to have rebuilt her entire map of the world in sound and texture. She knew this intersection by its acoustic signature the way sighted people knew it by its traffic light. And this sound did not belong here.\n\nShe knelt, pressing her palm flat against the sidewalk. The vibration was unmistakable. Something was flowing, six feet below her fingers, in a direction that no municipal map acknowledged.",
      wordCount: 198, applause: 47 },
    { id: "ch2", num: 2, title: "The Archive of Buried Channels", authorId: "p2", status: "published",
      text: "The Historical Society occupied the top floor of a building that should have been condemned. Maren climbed the stairs by counting \u2014 forty-two steps, a landing that smelled of mildewed carpet, then twenty more steps to a door that stuck in its frame.\n\n\u201CI need your oldest maps,\u201D she told the archivist, a man whose voice suggested tweed and resignation. \u201CThe ones from before the city paved the rivers.\u201D\n\nA silence. Then the scrape of a chair.\n\n\u201CNo one has asked for those in years,\u201D he said. \u201CThey\u2019re in the basement. Which is ironic, given what\u2019s down there.\u201D\n\nHe meant it as a joke. But when they descended and Maren pressed her hand to the basement wall, she felt it \u2014 the thrum of a current so close it seemed to push against the foundation stones. The archivist didn\u2019t notice. People who could see rarely listened to buildings.",
      wordCount: 156, applause: 32 },
    { id: "ch3", num: 3, title: "Cracks in the Foundation", authorId: null, status: "open", text: "", wordCount: 0, applause: 0 }
  ]
};

const CHARACTERS = [
  { id: "maren", name: "Maren", role: "Blind cartographer", driver: "p2", color: BRAND.yellow },
  { id: "sable", name: "Sable", role: "Guide dog", driver: null, color: "#8B7355" },
  { id: "archivist", name: "The Archivist", role: "Keeper of forgotten maps", driver: "p5", color: BRAND.sage },
  { id: "river", name: "The River", role: "The buried consciousness", driver: null, color: BRAND.sky },
  { id: "mayor", name: "Mayor Calloway", role: "Wants rivers hidden", driver: null, color: "#CC4444" }
];

const PORTRAITS = { hannah:"images/hannah-adams.jpg", greg:"images/greg-meredith.jpg", mike:"images/mike-stay.jpg", lilia:"images/lilia-rusu.jpg", jeff:"images/jeff-turner.jpg", stephen:"images/stephen-alexander.jpg" };
const DEMO_PLAYERS = [
  { id:"p2", name:"Aria", portrait:PORTRAITS.greg, role:"creator" },
  { id:"p3", name:"Kael", portrait:PORTRAITS.mike, role:"reader" },
  { id:"p4", name:"Nova", portrait:PORTRAITS.lilia, role:"reader" },
  { id:"p5", name:"Zeph", portrait:PORTRAITS.jeff, role:"creator" },
  { id:"p6", name:"Onyx", portrait:PORTRAITS.stephen, role:"reader" }
];
const COMMENTS = [
  { id:1, userId:"p3", name:"Kael", chapterId:"ch1", text:"The acoustic mapping premise is brilliant. Her blindness isn\u2019t a limitation \u2014 it\u2019s her superpower.", applause:12 },
  { id:2, userId:"p6", name:"Onyx", chapterId:"ch1", text:"Knowing an intersection by its acoustic signature... world-building that makes you stop and re-read.", applause:8 },
  { id:3, userId:"p4", name:"Nova", chapterId:"ch2", text:"People who could see rarely listened to buildings. This line is the whole thesis of the story.", applause:23 }
];
const COSTS = { DRIVE:100, AI_COAUTHOR:500, TALK_AUTHOR:250, TIP_MIN:10 };

function Avatar({src, size=32}) { return <img src={src} alt="" style={{width:size,height:size,borderRadius:"50%",objectFit:"cover",border:`2px solid ${BRAND.border}`,flexShrink:0}} />; }
function HumanIcon({size=14, color="#fff"}) { return (<svg width={size} height={size} viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="3" stroke={color} strokeWidth="1.5" fill="none"/><path d="M2.5 15c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5" stroke={color} strokeWidth="1.5" fill="none" strokeLinecap="round"/></svg>); }

function HowBtn({onClick}) { return <button onClick={onClick} style={{background:"#000",border:`1px solid ${BRAND.border}`,color:"#fff",borderRadius:20,padding:"12px 24px 8px",fontSize:16,cursor:"pointer",fontFamily:FH,letterSpacing:2,fontWeight:300,display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:1,minHeight:38,whiteSpace:"nowrap"}}>HOW THIS WORKS</button>; }

function TourIcon({type, color="rgba(255,255,255,0.55)", size=48}) {
  const icons = {
    dna: <svg width={size} height={size} viewBox="0 0 48 48" fill="none"><path d="M16 6c0 8 16 10 16 18s-16 10-16 18" stroke={color} strokeWidth="1.5" fill="none"/><path d="M32 6c0 8-16 10-16 18s16 10 16 18" stroke={color} strokeWidth="1.5" fill="none"/><line x1="16" y1="15" x2="32" y2="15" stroke={color} strokeWidth="1" opacity=".4"/><line x1="16" y1="24" x2="32" y2="24" stroke={color} strokeWidth="1" opacity=".4"/><line x1="16" y1="33" x2="32" y2="33" stroke={color} strokeWidth="1" opacity=".4"/></svg>,
    ear: <svg width={size} height={size} viewBox="0 0 48 48" fill="none"><path d="M30 10c6 3 10 9 10 16s-4 14-10 16" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><path d="M26 16c3 1.5 5 5 5 8s-2 7-5 8" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><circle cx="18" cy="24" r="4" fill={color} opacity=".5"/><line x1="8" y1="24" x2="14" y2="24" stroke={color} strokeWidth="1.5" strokeLinecap="round"/></svg>,
    selection: <svg width={size} height={size} viewBox="0 0 48 48" fill="none"><path d="M8 36L24 8l16 28H8z" stroke={color} strokeWidth="1.5" strokeLinejoin="round"/><circle cx="24" cy="28" r="4" fill={color} opacity=".4"/><line x1="16" y1="32" x2="32" y2="32" stroke={color} strokeWidth="1" opacity=".4"/></svg>,
    chain: <svg width={size} height={size} viewBox="0 0 48 48" fill="none"><rect x="8" y="14" width="14" height="20" rx="4" stroke={color} strokeWidth="1.5"/><rect x="26" y="14" width="14" height="20" rx="4" stroke={color} strokeWidth="1.5"/><line x1="22" y1="21" x2="26" y2="21" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><line x1="22" y1="27" x2="26" y2="27" stroke={color} strokeWidth="1.5" strokeLinecap="round"/></svg>,
    globe: <svg width={size} height={size} viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="18" stroke={color} strokeWidth="1.5"/><ellipse cx="24" cy="24" rx="9" ry="18" stroke={color} strokeWidth="1.5"/><line x1="6" y1="24" x2="42" y2="24" stroke={color} strokeWidth="1.5"/><path d="M8 14h32M8 34h32" stroke={color} strokeWidth="1" opacity=".5"/></svg>,
    book: <svg width={size} height={size} viewBox="0 0 48 48" fill="none"><path d="M8 8h14c2 0 2 2 2 2v28s0-2-2-2H8V8z" stroke={color} strokeWidth="1.5"/><path d="M40 8H26c-2 0-2 2-2 2v28s0-2 2-2h14V8z" stroke={color} strokeWidth="1.5"/><line x1="12" y1="16" x2="20" y2="16" stroke={color} strokeWidth="1" opacity=".5"/><line x1="12" y1="20" x2="18" y2="20" stroke={color} strokeWidth="1" opacity=".5"/><line x1="28" y1="16" x2="36" y2="16" stroke={color} strokeWidth="1" opacity=".5"/><line x1="28" y1="20" x2="34" y2="20" stroke={color} strokeWidth="1" opacity=".5"/></svg>,
    spectrum: <svg width={size} height={size} viewBox="0 0 48 48" fill="none"><rect x="6" y="32" width="8" height="10" rx="1" fill={color} opacity=".3"/><rect x="16" y="24" width="8" height="18" rx="1" fill={color} opacity=".45"/><rect x="26" y="16" width="8" height="26" rx="1" fill={color} opacity=".6"/><rect x="36" y="8" width="8" height="34" rx="1" fill={color} opacity=".8"/></svg>,
    bot: <svg width={size} height={size} viewBox="0 0 48 48" fill="none"><rect x="10" y="14" width="28" height="24" rx="5" stroke={color} strokeWidth="1.5"/><circle cx="19" cy="26" r="3" fill={color}/><circle cx="29" cy="26" r="3" fill={color}/><path d="M18 33c0 0 2.5 3 6 3s6-3 6-3" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><line x1="24" y1="6" x2="24" y2="14" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><circle cx="24" cy="5" r="2.5" fill={color}/></svg>,
  };
  return icons[type] || null;
}

function TourOverlay({onClose}) {
  const slides = [
    { icon:"book", title:"STORIES ARE\nBETTER TOGETHER", body:"A serial narrative unfolds in real time. You arrive as a reader. If the story moves you, you can step into it \u2014 comment, tip, drive a character, or propose where the plot goes next." },
    { icon:"spectrum", title:"FOUR WAYS IN\nONE SPECTRUM", body:"Reader (free) \u2192 Kibitzer (comment for free) \u2192 Character Driver (pay to take the wheel of a character) \u2192 Meta-Author (pay to propose plot changes). Deeper participation costs more tokens." },
    { icon:"bot", title:"AI IS A\nCHARACTER TOO", body:"The AI co-author isn\u2019t hidden. It\u2019s a named participant in the story, visible and addressable. Human and AI write together, publicly. The process is part of the art." },
    { icon:"chain", title:"BUILT ON\nF1R3FLY", body:"Every chapter, every comment, every character turn is a signed transaction on a F1R3FLY shard. The story\u2019s provenance is permanent, auditable, and community-owned." },
  ];
  const [si, setSi] = useState(0);
  const s = slides[si];
  const isLast = si === slides.length - 1;
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.95)",backdropFilter:"blur(12px)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:FH}} onClick={onClose}>
      <style>{`@keyframes tourIn{from{opacity:0;transform:scale(0.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}`}</style>
      <div onClick={e=>e.stopPropagation()} style={{animation:"tourIn .35s ease-out",maxWidth:460,width:"90%",padding:"48px 36px 40px",border:`1px solid #007bc466`,borderRadius:14,background:"#000",textAlign:"center"}}>
        <div style={{marginBottom:20}}><TourIcon type={s.icon} size={48}/></div>
        <div style={{fontSize:20,fontWeight:700,letterSpacing:4,color:BRAND.yellow,lineHeight:1.7,whiteSpace:"pre-line",margin:"0 0 16px",fontFamily:FH}}>{s.title}</div>
        <div style={{width:80,height:1,background:"linear-gradient(90deg, #F3D630, #8BB999)",margin:"0 auto 20px"}}/>
        <div style={{fontSize:17,color:"#fff",lineHeight:1.6,fontFamily:FB,marginBottom:36}}>{s.body}</div>
        <div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:28}}>
          {slides.map((_,i)=><div key={i} onClick={()=>setSi(i)} style={{width:10,height:10,borderRadius:"50%",background:i===si?BRAND.yellow:"rgba(255,255,255,0.2)",cursor:"pointer",transition:"background .2s"}} />)}
        </div>
        <div style={{display:"flex",justifyContent:"center",gap:16}}>
          {si > 0 && <button onClick={()=>setSi(si-1)} style={{background:"#000",border:`1px solid ${BRAND.border}`,color:"#fff",borderRadius:20,padding:"12px 24px 8px",fontSize:16,fontFamily:FH,letterSpacing:2,cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:1,minHeight:38}}>BACK</button>}
          <button onClick={()=>isLast?onClose():setSi(si+1)} style={{background:"linear-gradient(135deg, #5c0269, #7b0429)",border:"none",color:"#fff",borderRadius:20,padding:"12px 28px 8px",fontSize:16,fontFamily:FH,letterSpacing:2,fontWeight:600,cursor:"pointer",boxShadow:"0 0 16px rgba(123,4,41,0.4)",display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:1,minHeight:38}}>{isLast?"LET\u2019S GO":"NEXT"}</button>
        </div>
      </div>
    </div>
  );
}

function BuiltOnBadge() {
  return (
    <div style={{position:"fixed",bottom:16,left:"50%",transform:"translateX(-50%)",zIndex:100,cursor:"pointer"}} onClick={()=>window.open&&window.open("https://f1r3fly.io","_blank")}>
      <img src="built-on-f1r3fly.io-box.svg" alt="Built on F1R3FLY.IO" style={{height:48,display:"block"}}/>
    </div>
  );
}

function F1R3SideChat() {
  const [phase, setPhase] = useState("join");
  const [myName, setMyName] = useState("");
  const [showTour, setShowTour] = useState(false);
  const [currentCh, setCurrentCh] = useState("ch1");
  const [comments, setComments] = useState(COMMENTS);
  const [newComment, setNewComment] = useState("");
  const [myRole, setMyRole] = useState("reader");
  const [drivingChar, setDrivingChar] = useState(null);

  const chapter = STORY.chapters.find(c => c.id === currentCh) || STORY.chapters[0];
  const chapterComments = comments.filter(c => c.chapterId === currentCh);
  const handleJoin = () => { if (myName.trim()) setPhase("read"); };
  const addComment = () => { if (!newComment.trim()) return; setComments(c => [...c, { id:Date.now(), userId:"me", name:myName.trim()||"You", chapterId:currentCh, text:newComment.trim(), applause:0 }]); setNewComment(""); };
  const takeWheel = (charId) => { setMyRole("creator"); setDrivingChar(charId); };

  if (phase === "join") return (
    <div style={{minHeight:"100vh",background:"#000",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",fontFamily:FH,position:"relative",padding:"40px 20px"}}>
      <style>{FONTS}{`@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}} input:focus{border-color:#007bc466 !important;outline:none}`}</style>
      <div style={{animation:"fadeIn .6s ease-out",textAlign:"center",marginTop:-105,position:"relative",zIndex:1}}>
        <F1R3GamesLogo width={196}/>
        <div style={{fontSize:16,color:"#fff",letterSpacing:6,fontFamily:FH,fontWeight:300,marginTop:24}}>PRESENTS</div>
        <div style={{height:40}}/>
        <div style={{border:`1px solid #007bc466`,borderRadius:14,padding:"40px 48px",display:"inline-block",background:"#000"}}>
          <h1 style={{margin:"0 0 20px",display:"flex",alignItems:"center",justifyContent:"center"}}><SideChatLogo height={180}/></h1>
          <div style={{fontSize:16,color:"#fff",letterSpacing:4,fontWeight:300,fontFamily:FH,lineHeight:1.6}}>COLLABORATIVE FICTION,<br/>WRITTEN LIVE</div>
        </div>
        <div style={{height:50}}/>
        <div style={{display:"flex",flexDirection:"column",gap:10,alignItems:"center"}}>
          <div style={{fontSize:16,color:BRAND.yellow,letterSpacing:4,fontWeight:700,fontFamily:FH}}>CHOOSE YOUR F1R3SIGN</div>
          <input value={myName} onChange={e=>setMyName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleJoin()} placeholder="someone with a story" style={{background:"#000",border:`1px solid #007bc466`,borderRadius:6,color:"#fff",padding:"10px 16px",fontSize:16,fontWeight:300,width:"100%",maxWidth:460,fontFamily:FH,textAlign:"center",outline:"none",marginTop:20}}/>
          <button onClick={handleJoin} style={{background:`linear-gradient(135deg, #5c0269, #7b0429)`,color:"#fff",border:"none",borderRadius:20,padding:"12px 24px 8px",fontSize:16,fontFamily:FH,fontWeight:600,cursor:"pointer",letterSpacing:3,boxShadow:"0 0 20px rgba(123,4,41,0.4)",marginTop:20,display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:1,minHeight:38,whiteSpace:"nowrap"}}>JOIN</button>
          <div style={{fontSize:16,color:"#fff",letterSpacing:4,fontWeight:300,fontFamily:FH,lineHeight:2.2,marginTop:20}}>YOUR UNIQUE F1R3SIGN<br/>TRAVELS WITH YOU</div>
          <div style={{marginTop:12}}><HowBtn onClick={()=>setShowTour(true)}/></div>
        </div>
        <div style={{marginTop:16,color:BRAND.textSecondary,fontSize:16}}>{STORY.readers} readers</div>
      </div>
      <BuiltOnBadge/>
      {showTour && <TourOverlay onClose={()=>setShowTour(false)}/>}
    </div>
  );

  const displayName = myName.trim() || "You";
  const canWrite = myRole === "creator" && chapter.status === "open";

  return (
    <div style={{minHeight:"100vh",background:"#000",color:"#fff",fontFamily:FH,display:"flex",flexDirection:"column",position:"relative",paddingBottom:80}}>
      <style>{FONTS}{`::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}*{box-sizing:border-box}input::placeholder,textarea::placeholder{color:${BRAND.textSecondary};opacity:1}`}</style>

      <div className="game-header" style={{padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"#000",minHeight:70,gap:12}}>
        <div style={{display:"flex",alignItems:"baseline",gap:12,flexWrap:"wrap"}}>
          <span style={{display:"flex",alignItems:"center"}}><SideChatLogo height={27}/></span>
          <span style={{fontSize:16,color:"#fff",letterSpacing:2,fontFamily:FB}}>{STORY.readers} readers | {STORY.chapters.length} chapters | shard live</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <HowBtn onClick={()=>setShowTour(true)}/>
          <button onClick={()=>setPhase("join")} style={{background:"#000",border:`1px solid ${BRAND.border}`,color:"#fff",borderRadius:20,padding:"10px 18px 8px",fontSize:16,cursor:"pointer",fontFamily:FH,letterSpacing:1,display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:1,minHeight:38,whiteSpace:"nowrap"}}>LEAVE</button>
        </div>
      </div>
      <div style={{width:"100%",height:"0.5px",background:BRAND.stroke,opacity:0.8}}/>

      <div className="story-layout" style={{flex:1,display:"flex",overflow:"hidden"}}>

        {/* LEFT SIDEBAR — Identity + Kibitz */}
        <div className="game-sidebar-left" style={{width:300,minWidth:300,background:"#000",borderRight:`1px solid ${BRAND.border}`,display:"flex",flexDirection:"column",gap:20,padding:"20px 16px",overflowY:"auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:12,border:`1px solid ${BRAND.border}`,borderRadius:8,background:"#000"}}>
            <Avatar src={PORTRAITS.hannah} size={40}/>
            <div>
              <div style={{fontSize:16,color:CHAT_ACCENT,fontWeight:700,fontFamily:FH,letterSpacing:1}}>{displayName}</div>
              <div style={{fontSize:16,color:BRAND.textSecondary,fontFamily:FB,textTransform:"uppercase",letterSpacing:1}}>{myRole}{drivingChar && ` \u00b7 ${CHARACTERS.find(c=>c.id===drivingChar)?.name}`}</div>
            </div>
          </div>
          <div style={{border:`1px solid ${BRAND.border}`,borderRadius:8,padding:14,flex:1,display:"flex",flexDirection:"column"}}>
            <div style={{fontSize:16,color:"#fff",letterSpacing:2,fontFamily:FH,fontWeight:600,marginBottom:12,textTransform:"uppercase"}}>KIBITZ \u00b7 CH {chapter.num} ({chapterComments.length})</div>
            <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:12}}>
              {chapterComments.length === 0 && <div style={{color:BRAND.textSecondary,fontSize:16,fontFamily:FB,textAlign:"center",padding:"16px 0"}}>No comments yet.</div>}
              {chapterComments.map(c => (
                <div key={c.id} style={{padding:"8px 0",borderBottom:`1px solid ${BRAND.border}`,animation:"fadeUp 0.3s"}}>
                  <div style={{fontSize:16,fontWeight:600,color:"#fff",fontFamily:FH,marginBottom:4}}>{c.name}</div>
                  <div style={{fontSize:16,color:"#fff",lineHeight:1.6,fontFamily:FB}}>{c.text}</div>
                  <button onClick={()=>setComments(cs=>cs.map(x=>x.id===c.id?{...x,applause:x.applause+1}:x))} style={{marginTop:6,padding:"8px 14px 6px",borderRadius:20,fontSize:16,background:"transparent",border:`1px solid ${BRAND.border}`,color:BRAND.textSecondary,cursor:"pointer",fontFamily:FB,display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:1,whiteSpace:"nowrap"}}>&#128079; {c.applause}</button>
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:6,marginTop:10,paddingTop:10,borderTop:`1px solid ${BRAND.border}`}}>
              <input value={newComment} onChange={e=>setNewComment(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addComment()} placeholder="Comment..." style={{flex:1,background:"#000",border:`1px solid #007bc466`,borderRadius:6,padding:"8px 10px",color:"#fff",fontSize:16,outline:"none",fontFamily:FB}}/>
              <button onClick={addComment} disabled={!newComment.trim()} aria-label="Send" style={{background:newComment.trim()?`linear-gradient(135deg, ${CHAT_ACCENT}, #7b0429)`:"transparent",border:newComment.trim()?"none":`1px solid ${BRAND.border}`,borderRadius:6,padding:"8px 14px",color:newComment.trim()?"#fff":BRAND.textSecondary,fontWeight:700,fontSize:16,cursor:newComment.trim()?"pointer":"default",fontFamily:FH,letterSpacing:1}}>&uarr;</button>
            </div>
          </div>
          <div style={{paddingBottom:20,borderBottom:`1px solid ${BRAND.border}`}}>
            <div style={{fontSize:16,color:"#fff",letterSpacing:2,fontFamily:FH,fontWeight:600,marginBottom:12,textTransform:"uppercase"}}>{STORY.genre.toUpperCase()}</div>
            <div style={{fontSize:16,fontWeight:600,color:"#fff",fontFamily:FH,lineHeight:1.3,marginBottom:6}}>{STORY.title}</div>
            <div style={{fontSize:16,color:"#fff",fontFamily:FB,lineHeight:1.6,marginBottom:8}}>{STORY.synopsis}</div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:16,color:STORY.author.color,fontFamily:FH,fontWeight:600}}>by {STORY.author.name}</span>
              <span style={{fontSize:16,color:BRAND.textSecondary,fontFamily:FB,marginLeft:"auto"}}>{STORY.readers} readers</span>
            </div>
          </div>
        </div>

        {/* CENTER — Story */}
        <div className="story-main" style={{flex:1,overflow:"auto",padding:"32px 40px 60px"}}>
          <div style={{maxWidth:680,margin:"0 auto"}}>
            <div style={{fontSize:16,color:BRAND.textSecondary,letterSpacing:2,fontFamily:FH,marginBottom:8,textTransform:"uppercase"}}>CHAPTER {chapter.num}{chapter.authorId && <span style={{color:BRAND.sky,marginLeft:8}}>by {DEMO_PLAYERS.find(p=>p.id===chapter.authorId)?.name || "unknown"}</span>}</div>
            <h3 style={{fontSize:26,fontWeight:300,color:"#fff",fontFamily:FH,margin:"0 0 8px",letterSpacing:1}}>{chapter.title}</h3>
            {chapter.wordCount > 0 && <div style={{fontSize:16,color:BRAND.textSecondary,fontFamily:FB,marginBottom:24}}>{chapter.wordCount} words \u00b7 {chapter.applause} applause</div>}
            {chapter.text ? (
              <div>{chapter.text.split("\n").map((para, i) => para.trim() ? <p key={i} style={{fontSize:18,lineHeight:2,color:"#fff",fontFamily:FB,marginBottom:20,textIndent:i>0?24:0,letterSpacing:0.2}}>{para}</p> : <div key={i} style={{height:12}}/>)}</div>
            ) : (
              <div style={{textAlign:"center",padding:"60px 0"}}>
                <div style={{fontSize:16,color:BRAND.textSecondary,fontFamily:FB,marginBottom:16}}>This chapter is open for writing.</div>
                {canWrite ? <div style={{fontSize:16,color:CHAT_ACCENT,fontFamily:FH,letterSpacing:2}}>You're driving {CHARACTERS.find(c=>c.id===drivingChar)?.name}. Write below.</div>
                : <div style={{fontSize:16,color:"#fff",fontFamily:FB}}>Take the wheel on a character to start writing. <span style={{color:BRAND.yellow}}>({COSTS.DRIVE} tokens)</span></div>}
                {canWrite && <div style={{maxWidth:580,margin:"24px auto 0"}}><textarea placeholder="Continue the story..." style={{width:"100%",minHeight:180,background:"#000",border:`1px solid #007bc466`,borderRadius:8,padding:16,color:"#fff",fontSize:17,lineHeight:1.9,resize:"vertical",outline:"none",fontFamily:FB}}/><div style={{display:"flex",justifyContent:"flex-end",marginTop:12}}><button style={{background:`linear-gradient(135deg, ${CHAT_ACCENT}, #7b0429)`,color:"#fff",border:"none",borderRadius:20,padding:"12px 24px 8px",fontSize:16,fontFamily:FH,fontWeight:600,cursor:"pointer",letterSpacing:2,display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:1,minHeight:38,whiteSpace:"nowrap"}}>PUBLISH</button></div></div>}
              </div>
            )}
          </div>
        </div>

        {/* RIGHT SIDEBAR — Story info, Chapters, Characters, Engagement */}
        <div className="story-sidebar" style={{width:300,minWidth:300,background:"#000",borderLeft:`1px solid ${BRAND.border}`,display:"flex",flexDirection:"column",gap:20,padding:"20px 16px",overflowY:"auto"}}>
          <div style={{paddingBottom:20,borderBottom:`1px solid ${BRAND.border}`}}>
            <div style={{fontSize:16,color:"#fff",letterSpacing:2,fontFamily:FH,fontWeight:600,marginBottom:12,textTransform:"uppercase"}}>CHAPTERS</div>
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {STORY.chapters.map(ch => { const sel = ch.id===currentCh; return (
                <button key={ch.id} onClick={()=>setCurrentCh(ch.id)} style={{display:"flex",alignItems:"baseline",gap:8,padding:"8px 10px",borderRadius:6,textAlign:"left",cursor:"pointer",background:sel?"rgba(63,169,245,0.08)":"transparent",border:sel?`1px solid ${BRAND.border}`:"1px solid transparent",fontFamily:FH}}>
                  <span style={{fontSize:16,color:BRAND.textSecondary,fontFamily:FH,minWidth:22}}>{ch.num}.</span>
                  <div><div style={{fontSize:16,color:sel?"#fff":BRAND.textSecondary,fontWeight:sel?600:400}}>{ch.title}</div>{ch.status==="open" && <div style={{fontSize:16,color:BRAND.yellow,marginTop:2,fontFamily:FH,letterSpacing:1}}>OPEN FOR WRITING</div>}</div>
                </button>); })}
            </div>
          </div>
          <div style={{paddingBottom:20,borderBottom:`1px solid ${BRAND.border}`}}>
            <div style={{fontSize:16,color:"#fff",letterSpacing:2,fontFamily:FH,fontWeight:600,marginBottom:12,textTransform:"uppercase"}}>CHARACTERS</div>
            {CHARACTERS.map(ch => { const dn = ch.driver?DEMO_PLAYERS.find(p=>p.id===ch.driver)?.name:null; const av = !ch.driver; const isMe = drivingChar===ch.id; return (
              <div key={ch.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:`1px solid ${BRAND.border}`}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:ch.color,flexShrink:0}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:16,fontWeight:600,color:isMe?CHAT_ACCENT:ch.color,fontFamily:FH}}>{ch.name}</div>
                  <div style={{fontSize:16,color:"#fff",fontFamily:FB,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ch.role}</div>
                  {dn && <div style={{fontSize:16,color:BRAND.textSecondary,fontFamily:FB}}>Driven by {dn}</div>}
                </div>
                {av && !drivingChar && <button onClick={()=>takeWheel(ch.id)} style={{padding:"8px 14px 6px",borderRadius:20,fontSize:16,fontFamily:FH,letterSpacing:1,cursor:"pointer",background:"transparent",border:`1px solid ${BRAND.yellow}66`,color:BRAND.yellow,fontWeight:600,display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:1,minHeight:38,whiteSpace:"nowrap"}}>DRIVE</button>}
              </div>); })}
          </div>
          <div>
            <div style={{fontSize:16,color:"#fff",letterSpacing:2,fontFamily:FH,fontWeight:600,marginBottom:12,textTransform:"uppercase"}}>ENGAGEMENT</div>
            {[{label:"Comment",cost:"Free",color:BRAND.sage},{label:"Drive Character",cost:`${COSTS.DRIVE} tokens`,color:BRAND.yellow},{label:"Talk to Author",cost:`${COSTS.TALK_AUTHOR} tokens`,color:"#FF6B2B"},{label:"AI Co-Author",cost:`${COSTS.AI_COAUTHOR} tokens`,color:BRAND.sky}].map(e => (
              <div key={e.label} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",fontSize:16}}>
                <span style={{color:"#fff",fontFamily:FB}}>{e.label}</span>
                <span style={{color:e.color,fontFamily:FH,fontSize:16,fontWeight:600}}>{e.cost}</span>
              </div>))}
          </div>
        </div>
      </div>

      <BuiltOnBadge/>
      {showTour && <TourOverlay onClose={()=>setShowTour(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<F1R3SideChat/>);
</script>
</body>
</html>
